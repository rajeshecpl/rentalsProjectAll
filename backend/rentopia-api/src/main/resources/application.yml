spring:
  application:
    name: rentopia-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/rentopia}
    username: ${DB_USER:rentopia}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null

server:
  port: ${PORT:8080}
  error:
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

rentopia:
  security:
    jwt:
      # HMAC secret, at least 32 bytes. Must be provided via env in every environment.
      secret: ${JWT_SECRET:}
      issuer: rentopia-api
      access-token-ttl: 15m
      refresh-token-ttl: 30d
  otp:
    length: 6
    ttl: 5m
    max-attempts: 5
    max-sends-per-window: 5
    send-window: 15m
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
